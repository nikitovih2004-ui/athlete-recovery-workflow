name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      TELEGRAM_BOT_TOKEN: "100001:test-only-placeholder"
      TELEGRAM_CHAT_ID: "100001"
      WHOOP_CLIENT_ID: "test-client-id"
      WHOOP_CLIENT_SECRET: "test-client-secret"
      WHOOP_REDIRECT_URI: "http://localhost:8080/callback"
      CONVERSATIONAL_ROUTER_ENABLED: "true"
      GEMINI_VISION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/public_acceptance_scan.py
      - run: python scripts/public_release_checks.py
      - run: python -m unittest discover -s tests -v
